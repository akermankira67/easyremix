name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DENO_VERSION: v2.5.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download deno (JavaScript runtime used by yt-dlp for YouTube)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest "https://github.com/denoland/deno/releases/download/$env:DENO_VERSION/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bin -Force
          bin\deno.exe --version

      - name: Build single EXE
        run: pyinstaller EasyRemix.spec --noconfirm

      - name: Self-test the EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EasyRemix.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\easyremix-selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Remove-Item dist\easyremix-selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EasyRemix-windows
          path: dist/EasyRemix.exe

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EasyRemix.exe
