name: Build Windows EXE

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.3 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  DENO_VERSION: v2.5.6

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download deno (JavaScript runtime used by yt-dlp for YouTube)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Invoke-WebRequest "https://github.com/denoland/deno/releases/download/$env:DENO_VERSION/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bin -Force
          bin\deno.exe --version

      - name: Build EasyRemix folder (EasyRemix.exe + _internal)
        run: pyinstaller EasyRemix.spec --noconfirm

      - name: Self-test the EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EasyRemix\EasyRemix.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\EasyRemix\easyremix-selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
          Remove-Item dist\EasyRemix\easyremix-selftest.txt

      - name: Zip the program folder
        shell: pwsh
        run: Compress-Archive -Path dist\EasyRemix -DestinationPath dist\EasyRemix-windows.zip

      - name: Work out release version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # The artifact is the EasyRemix folder (GitHub zips it for download).
      - uses: actions/upload-artifact@v4
        with:
          name: EasyRemix-windows
          path: dist/EasyRemix/

      # Runs for a pushed v* tag, or a manual run with a version (creates the tag itself).
      - name: Publish release
        if: steps.ver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: EasyRemix ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/EasyRemix-windows.zip
